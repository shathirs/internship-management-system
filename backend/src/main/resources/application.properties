spring.application.name=backend
server.port=8080

spring.main.banner-mode=off

logging.level.root=ERROR
logging.level.org.springframework=ERROR
logging.level.org.apache=ERROR
logging.level.org.mongodb=ERROR

# MongoDB (values from .env)
spring.mongodb.uri=${spring.mongodb.uri}

# JWT (values from .env)
app.jwt.secret=${app.jwt.secret}
app.jwt.expiration=${app.jwt.expiration}

# Seed admin user
app.seed.admin.name=${app.seed.admin.name:System Admin}
app.seed.admin.email=${app.seed.admin.email}
app.seed.admin.password=${app.seed.admin.password}
